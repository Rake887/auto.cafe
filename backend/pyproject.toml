[project]
name = "qrmenu-backend"
version = "0.1.0"
description = "QR-Menu MVP backend (FastAPI + aiogram)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "aiogram>=3.15",
    "pydantic-settings>=2.6",
    "segno>=1.6",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.20",
    "pillow>=11.0",
]

[tool.uv]
package = false
